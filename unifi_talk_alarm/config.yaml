name: UniFi Talk Alarm Add-on
version: "0.1.3"
slug: unifi_talk_alarm
description: Places authenticated alarm calls through a dedicated UniFi Talk SIP extension
url: https://github.com/RAFd3v-HA/HACS-Unifi-Talk-Alarm-Addon
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
host_network: true
options:
  # UI copy/paste order from Talk > Phones > Add Third-Party Device > Overview.
  sip_server: ""
  sip_port: 5060
  sip_extension: ""
  sip_password: ""
  sip_transport: udp
  outbound_proxy: ""
  api_token: ""
  api_port: 8099
  allowed_number_rules:
    - "prefix:1"
  blocked_number_rules:
    - "exact:110"
    - "exact:112"
    - "exact:911"
    - "exact:999"
  allowed_audio_hosts:
    - homeassistant.local
  tts_voice: de
  tts_speed: 160
  max_calls_per_window: 3
  rate_limit_window_seconds: 300
  max_audio_bytes: 5242880
  max_audio_seconds: 120
  hangup_buffer_seconds: 1.0
  terminal_state_seconds: 15
  log_level: info
schema:
  # Keep the four Talk values in the same order as the options UI above.
  sip_server: str
  sip_port: port
  sip_extension: str
  sip_password: password
  sip_transport: list(udp|tcp|tls)
  outbound_proxy: str?
  api_token: password
  api_port: port
  allowed_number_rules:
    - str
  blocked_number_rules:
    - str
  allowed_audio_hosts:
    - str
  tts_voice: str
  tts_speed: int(80,450)
  max_calls_per_window: int(1,100)
  rate_limit_window_seconds: int(10,86400)
  max_audio_bytes: int(65536,52428800)
  max_audio_seconds: int(1,600)
  hangup_buffer_seconds: float(0,10)
  terminal_state_seconds: int(2,300)
  log_level: list(debug|info|warning|error)
